name: Deploy to ECS

on:
  workflow_run:
    workflows: ["Build and Push Images"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image SHA tag to deploy
        required: true

env:
  AWS_REGION: eu-west-2
  ACCOUNT: 989346120260
  REGISTRY: 989346120260.dkr.ecr.eu-west-2.amazonaws.com
  PROJECT: ecs-combined
  CLUSTER: ecs-combined-dev

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy to dev
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::989346120260:role/ecs-combined-github-actions
          aws-region: eu-west-2

      - name: Set image tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "sha=${{ github.event.inputs.image_tag }}" >> $GITHUB_OUTPUT
          else
            echo "sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          fi

      - name: Deploy all services
        run: |
          SHA=${{ steps.tag.outputs.sha }}
          
          for svc in api worker dashboard; do
            echo "==> Deploying $svc with tag $SHA"

            TASK_DEF=$(aws ecs describe-services \
              --cluster $CLUSTER \
              --services ${CLUSTER}-${svc} \
              --region $AWS_REGION \
              --query "services[0].taskDefinition" \
              --output text)

            aws ecs describe-task-definition \
              --task-definition $TASK_DEF \
              --region $AWS_REGION \
              --query "taskDefinition" \
              --output json > /tmp/task-${svc}.json

            NEW_IMAGE="${REGISTRY}/${PROJECT}/${svc}:${SHA}"

            python3 -c "
          import json
          with open('/tmp/task-${svc}.json') as f:
              td = json.load(f)
          td['containerDefinitions'][0]['image'] = '${NEW_IMAGE}'
          for key in ['taskDefinitionArn','revision','status','requiresAttributes','compatibilities','registeredAt','registeredBy','deregisteredAt']:
              td.pop(key, None)
          with open('/tmp/task-${svc}-new.json', 'w') as f:
              json.dump(td, f)
          "

            NEW_ARN=$(aws ecs register-task-definition \
              --region $AWS_REGION \
              --cli-input-json file:///tmp/task-${svc}-new.json \
              --query "taskDefinition.taskDefinitionArn" \
              --output text)

            aws ecs update-service \
              --cluster $CLUSTER \
              --service ${CLUSTER}-${svc} \
              --task-definition $NEW_ARN \
              --region $AWS_REGION \
              --no-cli-pager > /dev/null

            echo "==> Deployed $svc: $NEW_ARN"
          done

      - name: Wait for stability
        run: |
          echo "Waiting 30 seconds for services to stabilise..."
          sleep 30
          
          aws ecs describe-services \
            --cluster $CLUSTER \
            --services ${CLUSTER}-api ${CLUSTER}-worker ${CLUSTER}-dashboard \
            --region $AWS_REGION \
            --query "services[].{Name:serviceName,Desired:desiredCount,Running:runningCount}" \
            --output table

      - name: Smoke test
        run: |
          ALB=$(aws elbv2 describe-load-balancers \
            --region $AWS_REGION \
            --names ecs-combined-dev \
            --query "LoadBalancers[0].DNSName" \
            --output text)

          echo "Testing https://$ALB/health"

          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://$ALB/health)
            echo "Attempt $i - HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "Smoke test passed"
              exit 0
            fi
            sleep 15
          done

          echo "Smoke test failed"
          exit 1

      - name: Rollback on failure
        if: failure()
        run: |
          echo "Deploy failed - rolling back"
          for svc in api worker dashboard; do
            PREV=$(aws ecs describe-services \
              --cluster $CLUSTER \
              --services ${CLUSTER}-${svc} \
              --region $AWS_REGION \
              --query "services[0].deployments[-1].taskDefinition" \
              --output text)
            
            aws ecs update-service \
              --cluster $CLUSTER \
              --service ${CLUSTER}-${svc} \
              --task-definition $PREV \
              --region $AWS_REGION \
              --no-cli-pager > /dev/null
            
            echo "Rolled back $svc to $PREV"
          done